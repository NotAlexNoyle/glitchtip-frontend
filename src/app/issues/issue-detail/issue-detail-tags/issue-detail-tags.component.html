@if (rankedTags()?.length) {
  <div class="rail-tags">
    <mat-divider class="rail-tags__divider"></mat-divider>
    <h3 class="detail-section-header">Tags</h3>
    @for (tag of rankedTags(); track tag.key) {
      <a
        class="tag-row"
        [class.tag-row--constant]="tag.uniqueValues <= 1"
        [routerLink]="['/', orgSlug(), 'issues']"
        [queryParams]="tagQuery(tag.key, tag.topValues[0].value)"
        queryParamsHandling="merge"
        [matTooltip]="'Filter by ' + tag.topValues[0].value"
        matTooltipPosition="left"
      >
        <span class="tag-row__head caption-text">
          <span class="tag-row__key">{{ tag.key }}</span>
          <span class="tag-row__val">{{ tag.topValues[0].value }}</span>
          @if (tag.uniqueValues > 1) {
            <span class="tag-row__pct">{{ tag.topValues[0].percentRounded }}%</span>
          }
        </span>
        @if (tag.uniqueValues > 1) {
          <!-- One honest track: the fill IS the top value's share, not decoration. -->
          <span class="tag-row__track">
            <span
              class="tag-row__fill"
              [style.width.%]="tag.topValues[0].percentRounded"
            ></span>
          </span>
        }
      </a>
    }
  </div>
}
