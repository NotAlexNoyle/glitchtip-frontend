@if (eventEntryMessage(); as message) {
  <gt-panel flush i18n-title title="Message">
    <div class="gt-kv">
      <div class="gt-kv__row">
        <span class="gt-kv__k" i18n>Message</span>
        <span class="gt-kv__v gt-break message">{{
          message.formatted || message.message
        }}</span>
      </div>
      @if (template(); as template) {
        <div class="gt-kv__row">
          <span class="gt-kv__k" i18n>Template</span>
          <span class="gt-kv__v gt-mono gt-break message">{{ template }}</span>
        </div>
      }
      @if (paramsText(); as paramsLine) {
        <div class="gt-kv__row">
          <span class="gt-kv__k"
            ><ng-container i18n>Params</ng-container>
            <span class="gt-kv__count">{{ params().length }}</span></span
          >
          <span class="gt-kv__v gt-mono gt-break">{{ paramsLine }}</span>
        </div>
      }
    </div>
  </gt-panel>
}
