@if (eventEntryCSP()) {
  <gt-panel flush i18n-title title="CSP report" [subtitle]="subtitle()">
    <gt-ghost-select
      slot="actions"
      i18n-ariaLabel
      ariaLabel="CSP report format"
      [width]="104"
      [options]="formats"
      [(value)]="format"
    />
    @if (format() === "raw") {
      <pre class="gt-raw gt-raw--wrap">{{ raw() }}</pre>
    } @else {
      <div class="gt-kv">
        @for (r of rows(); track r.key) {
          <div class="gt-kv__row">
            <span class="gt-kv__k">{{ r.label }}</span>
            <span
              class="gt-kv__v gt-break csp-value"
              [class.gt-mono]="r.mono"
              >{{ r.value }}</span
            >
          </div>
        }
      </div>
    }
  </gt-panel>
}
