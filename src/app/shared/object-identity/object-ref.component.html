@if (link(); as link) {
  <a
    class="object-ref object-ref--link"
    [class.object-ref--mono]="mono()"
    [style.--gt-object-accent]="accent()"
    [routerLink]="link"
  >
    <mat-icon class="object-ref__icon" inline="true">{{ glyph() }}</mat-icon>
    <span class="object-ref__label">{{ label() }}</span>
  </a>
} @else {
  <span
    class="object-ref"
    [class.object-ref--mono]="mono()"
    [style.--gt-object-accent]="accent()"
  >
    <mat-icon class="object-ref__icon" inline="true">{{ glyph() }}</mat-icon>
    <span class="object-ref__label">{{ label() }}</span>
  </span>
}
