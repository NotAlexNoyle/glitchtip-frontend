<div class="panel">
  <div class="panel-copy">
    <!-- The product's view switcher (button-toggle), sitting over the copy it changes. -->
    <mat-button-toggle-group
      class="switch"
      hideSingleSelectionIndicator
      [value]="active()"
      (change)="active.set($event.value)"
      aria-label="GlitchTip features"
    >
      @for (f of features; track f.id; let i = $index) {
        <mat-button-toggle [value]="i">
          <mat-icon class="switch-icon">{{ f.icon }}</mat-icon>
          {{ f.title }}
        </mat-button-toggle>
      }
    </mat-button-toggle-group>

    @for (f of [current()]; track active()) {
      <div class="copy">
        <h2 class="marketing-subheading">{{ f.heading }}</h2>
        <p class="marketing-body">{{ f.body }}</p>
        <ul class="points">
          @for (point of f.points; track point) {
            <li>
              <mat-icon class="point-icon">check_circle</mat-icon>
              <span>{{ point }}</span>
            </li>
          }
        </ul>
      </div>
    }
  </div>
  <div class="panel-media">
    @for (f of [current()]; track active()) {
      <mkt-responsive-image
        [src1x]="f.imageSrc"
        [alt]="f.imageAlt"
        class="screenshot"
      ></mkt-responsive-image>
    }
  </div>
</div>
